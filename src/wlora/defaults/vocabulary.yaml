# Tags never wanted in training captions (quality/subjective/meta words).
blocklist:
  - masterpiece
  - best quality
  - high quality
  - highly detailed
  - detailed
  - beautiful
  - amazing
  - cute
  - adorable
  - cozy
  - relaxed
  - relaxed pose
  - pet
  - animal
  - photo
  - photograph
  - photography
  - realistic
  - photorealistic
  - real life
  - feline
  - kitty
  - domestic cat
  - textured background
  - cute expression
  - fluffy
  - "*shot"
  - "*composition"
  - "*atmosphere"
  - "*mood"

# Groups of mutually exclusive tags: when several appear, the first one in the
# caption order wins (taxonomy-derived tags come first, so they win).
exclusive:
  - [indoors, outdoors]
  - [close-up, upper body, full body, wide shot]
  - [no humans, hand, 1girl, 1boy, solo focus]
  - [closed eyes, looking at viewer]
  - [closed eyes, looking away]
  - [closed eyes, looking up]
  - [closed eyes, looking down]
  - [closed eyes, looking to the side]
  - [sleeping, looking at viewer]
  - [sleeping, looking away]
  - [no humans, arm]
  - [closed eyes, half-closed eyes]

# Tags implied by others; the implied tag is removed when the implying tag is present.
implies:
  on back: lying
  on side: lying
  on stomach: lying
  curled up: lying
